kind = "web"
previewPath = "/"
title = "CryptoPay Discord 收款中心"
description = "管理 Discord 加密貨幣收款機器人的營運後台，可建立繳費單、查看幣價與費用、追蹤付款狀態及設定收款規則。"
version = "1.0.0"
id = "artifacts/crypto-pay-discord"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23869

[services.development]
run = "pnpm --filter @workspace/crypto-pay-discord run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crypto-pay-discord", "run", "build" ]
serve = "static"
publicDir = "artifacts/crypto-pay-discord/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23869"
BASE_PATH = "/"
